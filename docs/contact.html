<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - AI Lofi-Music Generator</title>
    <link rel="icon" type="image/jpg" href="logo-tab-1.jpg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <!-- Logo with photo placeholder -->
        <div class="logo">
            <img src="logo.jpg" alt="Logo" style="height:50px; vertical-align:middle; margin-right:10px;">
        </div>
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="founder.html">Founder</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

<main>
    <section class="contact-section fade-up hidden">
        <h2>Contact</h2>
        <form class="contact-form">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" placeholder="Your name" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Your email" required>

            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone" placeholder="Your phone number" required>

            <label for="purpose">Purpose</label>
            <textarea id="purpose" name="purpose" placeholder="Write your message here..." required></textarea>

            <button type="submit">Submit</button>
        </form>
    </section>
</main>


    <footer>

</body>
